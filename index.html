<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 4 Spelling Words (1~300)</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --accent: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 20px; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 800px; }
    h1 { margin: 0 0 10px 0; color: #312e81; font-size: 1.8rem; }
    
    .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 800px; }
    select, button { padding: 10px 16px; border-radius: 8px; border: 1px solid #cbd5e1; background: white; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
    button { background-color: var(--primary); color: white; border: none; font-weight: 600; }
    button:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
    select { font-weight: 500; color: #334155; }

    .nav-tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; width: 100%; max-width: 800px; }
    .tab-btn { background: #e2e8f0; color: #475569; border: none; font-size: 0.95rem; }
    .tab-btn.active { background: var(--primary); color: white; }

    .game-area { width: 100%; max-width: 800px; min-height: 400px; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    /* Mode 1: Flashcard */
    .flashcard { width: 320px; height: 220px; background: white; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.3s; position: relative; padding: 20px; text-align: center; }
    .flashcard .num-tag { position: absolute; top: 12px; left: 15px; font-size: 0.85rem; color: #64748b; font-weight: bold; }
    .flashcard .speaker-btn { position: absolute; top: 10px; right: 12px; background: #e0e7ff; color: var(--primary); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .flashcard .word { font-size: 2rem; font-weight: bold; color: #1e1b4b; margin-bottom: 10px; }
    .flashcard .translation { font-size: 1.4rem; color: #059669; font-weight: 600; min-height: 2rem; }

    /* Mode 2: Quiz */
    .quiz-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
    .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
    .option-btn { background: #f1f5f9; color: #1e293b; border: 2px solid #e2e8f0; padding: 14px; border-radius: 10px; font-size: 1.1rem; }
    .option-btn:hover { background: #e2e8f0; }

    /* Mode 3: Spelling */
    .spelling-box { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
    .spelling-input { font-size: 1.4rem; padding: 10px; text-align: center; border: 2px solid #cbd5e1; border-radius: 8px; width: 80%; margin: 15px 0; outline: none; }
    .spelling-input:focus { border-color: var(--primary); }

    /* Mode 4: Match Game */
    .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 600px; }
    .match-item { background: white; border: 2px solid #e2e8f0; padding: 15px; border-radius: 10px; text-align: center; font-size: 1.1rem; cursor: pointer; font-weight: 500; }
    .match-item.selected { border-color: var(--primary); background: #e0e7ff; }
    .match-item.matched { visibility: hidden; }

    /* Mode 5: Memory Flip */
    .memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 650px; }
    .memory-card { height: 90px; background: var(--primary); color: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1rem; cursor: pointer; text-align: center; padding: 5px; user-select: none; }
    .memory-card.flipped { background: white; color: var(--text); border: 2px solid var(--primary); }
    .memory-card.matched { background: #d1fae5; color: #065f46; border: 2px solid #10b981; cursor: default; }

    .score-board { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; color: #4338ca; }
  </style>
</head>

    let currentGroup = "1 ~ 25";
    let currentWords = [];
    let currentMode = 1;
    let flashIndex = 0;
    let isFlipped = false;

    // Initialize Dropdown
    const select = document.getElementById("group-select");
    Object.keys(ALL_WORDS).forEach(key => {
      let opt = document.createElement("option");
      opt.value = key;
      opt.textContent = `第 ${key} 單字`;
      select.appendChild(opt);
    });
    let allOpt = document.createElement("option");
    allOpt.value = "ALL";
    allOpt.textContent = "🌟 全部 1 ~ 300 單字";
    select.appendChild(allOpt);

    function updateCurrentWords() {
      if (currentGroup === "ALL") {
        currentWords = [].concat(...Object.values(ALL_WORDS));
      } else {
        currentWords = ALL_WORDS[currentGroup] || [];
      }
    }

    function changeGroup() {
      currentGroup = document.getElementById("group-select").value;
      updateCurrentWords();
      flashIndex = 0;
      loadMode();
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll(".tab-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", idx + 1 === mode);
      });
      loadMode();
    }

    function speak(text, e) {
      if (e) e.stopPropagation();
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }

    function shuffle(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function loadMode() {
      const container = document.getElementById("game-container");
      container.innerHTML = "";
      if (currentWords.length === 0) return;

      if (currentMode === 1) renderFlashcard(container);
      else if (currentMode === 2) renderQuiz(container);
      else if (currentMode === 3) renderSpelling(container);
      else if (currentMode === 4) renderMatchGame(container);
      else if (currentMode === 5) renderMemoryGame(container);
    }

    /* --- Mode 1: Flashcard --- */
    function renderFlashcard(container) {
      const item = currentWords[flashIndex];
      isFlipped = false;
      container.innerHTML = `
        <div class="flashcard" onclick="toggleCard()">
          <span class="num-tag">#${item.num}</span>
          <button class="speaker-btn" onclick="speak('${item.en}', event)">🔊</button>
          <div class="word">${item.en}</div>
          <div class="translation" id="card-zh" style="display:none;">${item.zh}</div>
        </div>
        <div style="margin-top: 20px; display: flex; gap: 15px;">
          <button onclick="prevCard()">⬅️ 上一個</button>
          <span style="align-self: center; font-weight: bold;">${flashIndex + 1} / ${currentWords.length}</span>
          <button onclick="nextCard()">下一個 ➡️</button>
        </div>
      `;
      speak(item.en);
    }

    function toggleCard() {
      const zh = document.getElementById("card-zh");
      if (zh) {
        isFlipped = !isFlipped;
        zh.style.display = isFlipped ? "block" : "none";
      }
    }
    function prevCard() {
      flashIndex = (flashIndex - 1 + currentWords.length) % currentWords.length;
      renderFlashcard(document.getElementById("game-container"));
    }
    function nextCard() {
      flashIndex = (flashIndex + 1) % currentWords.length;
      renderFlashcard(document.getElementById("game-container"));
    }

    /* --- Mode 2: Quiz --- */
    let quizScore = 0;
    let quizIndex = 0;
    let quizList = [];

    function renderQuiz(container) {
      quizList = shuffle(currentWords);
      quizIndex = 0;
      quizScore = 0;
      showQuizQuestion(container);
    }

    function showQuizQuestion(container) {
      if (quizIndex >= quizList.length) {
        container.innerHTML = `
          <div class="quiz-card">
            <h2>🎉 測驗完成！</h2>
            <p class="score-board">最終得分：${quizScore} / ${quizList.length}</p>
            <button onclick="renderQuiz(document.getElementById('game-container'))">再試一次 🔄</button>
          </div>
        `;
        return;
      }

      const q = quizList[quizIndex];
      let options = [q];
      while (options.length < 4 && options.length < currentWords.length) {
        let rand = currentWords[Math.floor(Math.random() * currentWords.length)];
        if (!options.includes(rand)) options.push(rand);
      }
      options = shuffle(options);

      container.innerHTML = `
        <div class="quiz-card">
          <div class="score-board">進度：${quizIndex + 1} / ${quizList.length} | 得分：${quizScore}</div>
          <h2 style="font-size: 2.2rem; margin: 10px 0; color: #1e1b4b;">${q.en}</h2>
          <button style="margin-bottom: 15px;" onclick="speak('${q.en}')">🔊 聽發音</button>
          <div class="quiz-options">
            ${options.map(opt => `<button class="option-btn" onclick="checkQuiz('${opt.zh}', '${q.zh}')">${opt.zh}</button>`).join('')}
          </div>
        </div>
      `;
      speak(q.en);
    }

    function checkQuiz(selected, correct) {
      if (selected === correct) {
        alert("✨ 答對了！Great job!");
        quizScore++;
      } else {
        alert(`❌ 答錯囉！正確答案是：${correct}`);
      }
      quizIndex++;
      showQuizQuestion(document.getElementById("game-container"));
    }

    /* --- Mode 3: Spelling --- */
    let spellIndex = 0;
    let spellList = [];

    function renderSpelling(container) {
      spellList = shuffle(currentWords);
      spellIndex = 0;
      showSpellingQuestion(container);
    }

    function showSpellingQuestion(container) {
      if (spellIndex >= spellList.length) {
        container.innerHTML = `
          <div class="spelling-box">
            <h2>🎉 拼字大考驗完成！</h2>
            <button onclick="renderSpelling(document.getElementById('game-container'))">再練一次 🔄</button>
          </div>
        `;
        return;
      }
      const q = spellList[spellIndex];
      container.innerHTML = `
        <div class="spelling-box">
          <h3>請看中文拼出英文單字：</h3>
          <h2 style="color: #059669; font-size: 1.8rem; margin: 15px 0;">${q.zh}</h2>
          <button onclick="speak('${q.en}')">🔊 聽提示音</button><br>
          <input type="text" id="spell-input" class="spelling-input" placeholder="在此輸入英文" autocomplete="off" autofocus onkeyup="if(event.key==='Enter') checkSpelling('${q.en}')"><br>
          <button onclick="checkSpelling('${q.en}')">送出答案</button>
          <p id="spell-msg" style="margin-top: 15px; font-weight: bold;"></p>
        </div>
      `;
    }

    function checkSpelling(correct) {
      const input = document.getElementById("spell-input").value.trim().toLowerCase();
      const msg = document.getElementById("spell-msg");
      if (input === correct.toLowerCase()) {
        msg.style.color = "#10b981";
        msg.textContent = "🎉 恭喜！拼寫完全正確！";
        speak(correct);
        setTimeout(() => {
          spellIndex++;
          showSpellingQuestion(document.getElementById("game-container"));
        }, 1200);
      } else {
        msg.style.color = "#ef4444";
        msg.textContent = `❌ 再試試看！提示：第一個字母是 '${correct[0]}'`;
      }
    }

    /* --- Mode 4: Match Game --- */
    let selectedMatch = null;

    function renderMatchGame(container) {
      let sample = shuffle(currentWords).slice(0, 6);
      let left = shuffle(sample);
      let right = shuffle(sample);
      selectedMatch = null;

      container.innerHTML = `
        <div style="width: 100%; max-width: 600px; text-align: center;">
          <h3>點擊英文單字，再點擊對應的中文配對：</h3>
          <div class="match-grid">
            <div id="left-col" style="display:flex; flex-direction:column; gap:10px;">
              ${left.map(w => `<div class="match-item" data-type="en" data-val="${w.en}" onclick="selectMatch(this)">${w.en}</div>`).join('')}
            </div>
            <div id="right-col" style="display:flex; flex-direction:column; gap:10px;">
              ${right.map(w => `<div class="match-item" data-type="zh" data-val="${w.en}" onclick="selectMatch(this)">${w.zh}</div>`).join('')}
            </div>
          </div>
          <button style="margin-top:20px;" onclick="renderMatchGame(document.getElementById('game-container'))">換一批單字 🔄</button>
        </div>
      `;
    }

    function selectMatch(el) {
      if (el.classList.contains("matched")) return;

      if (!selectedMatch) {
        selectedMatch = el;
        el.classList.add("selected");
        if (el.dataset.type === "en") speak(el.dataset.val);
      } else {
        if (selectedMatch === el) {
          el.classList.remove("selected");
          selectedMatch = null;
          return;
        }

        if (selectedMatch.dataset.type !== el.dataset.type) {
          if (selectedMatch.dataset.val === el.dataset.val) {
            selectedMatch.classList.add("matched");
            el.classList.add("matched");
            selectedMatch.classList.remove("selected");
            selectedMatch = null;
          } else {
            el.classList.add("selected");
            setTimeout(() => {
              selectedMatch.classList.remove("selected");
              el.classList.remove("selected");
              selectedMatch = null;
            }, 500);
          }
        } else {
          selectedMatch.classList.remove("selected");
          selectedMatch = el;
          el.classList.add("selected");
          if (el.dataset.type === "en") speak(el.dataset.val);
        }
      }
    }

    /* --- Mode 5: Memory Flip Game --- */
    let memoryCards = [];
    let flippedCards = [];

    function renderMemoryGame(container) {
      let sample = shuffle(currentWords).slice(0, 6);
      let cards = [];
      sample.forEach((w, idx) => {
        cards.push({ id: idx, text: w.en, type: 'en', val: w.en });
        cards.push({ id: idx, text: w.zh, type: 'zh', val: w.en });
      });
      memoryCards = shuffle(cards);
      flippedCards = [];

      container.innerHTML = `
        <div style="text-align:center;">
          <h3>翻牌記憶對對碰（翻出對應的英文與中文）：</h3>
          <div class="memory-grid">
            ${memoryCards.map((c, i) => `<div class="memory-card" id="mem-${i}" onclick="flipMemoryCard(${i})">❓</div>`).join('')}
          </div>
          <button style="margin-top:20px;" onclick="renderMemoryGame(document.getElementById('game-container'))">重新開始 🔄</button>
        </div>
      `;
    }

    function flipMemoryCard(index) {
      if (flippedCards.length >= 2) return;
      const cardEl = document.getElementById(`mem-${index}`);
      const data = memoryCards[index];

      if (cardEl.classList.contains("flipped") || cardEl.classList.contains("matched")) return;

      cardEl.classList.add("flipped");
      cardEl.textContent = data.text;
      if (data.type === 'en') speak(data.text);
      flippedCards.push({ index, data });

      if (flippedCards.length === 2) {
        const [c1, c2] = flippedCards;
        if (c1.data.id === c2.data.id) {
          setTimeout(() => {
            document.getElementById(`mem-${c1.index}`).classList.add("matched");
            document.getElementById(`mem-${c2.index}`).classList.add("matched");
            flippedCards = [];
          }, 600);
        } else {
          setTimeout(() => {
            document.getElementById(`mem-${c1.index}`).classList.remove("flipped");
            document.getElementById(`mem-${c1.index}`).textContent = "❓";
            document.getElementById(`mem-${c2.index}`).classList.remove("flipped");
            document.getElementById(`mem-${c2.index}`).textContent = "❓";
            flippedCards = [];
          }, 1000);
        }
      }
    }

    // App Initialization
    updateCurrentWords();
    loadMode();
  </script>
