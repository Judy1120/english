        { id: 146, word: "voyage", translation: "航海 / 航行" },
        { id: 147, word: "permanent", translation: "永久的" },
        { id: 148, word: "forever", translation: "永遠" },
        { id: 149, word: "tremendous", translation: "巨大的 / 極大的" },
        { id: 150, word: "enormous", translation: "巨大的" },
        { id: 151, word: "uncover", translation: "揭開 / 發現" },
        { id: 152, word: "expose", translation: "暴露 / 揭露" }
      ]
    };

    function App() {
      const [currentCategory, setCurrentCategory] = useState("1 ~ 25");
      const [mode, setMode] = useState("list");
      const [currentIndex, setCurrentIndex] = useState(0);
      const [options, setOptions] = useState([]);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [score, setScore] = useState(0);
      const [streak, setStreak] = useState(0);

      const words = ALL_WORDS[currentCategory] || [];

      const speakWord = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = 0.85;
          window.speechSynthesis.speak(utterance);
        }
      };

      const generateQuizOptions = (index) => {
        const correctWord = words[index];
        if (!correctWord) return;

        let allOtherWords = [];
        Object.values(ALL_WORDS).forEach(group => {
          group.forEach(w => {
            if (w.word !== correctWord.word) allOtherWords.push(w);
          });
        });

        const shuffledOthers = [...allOtherWords].sort(() => 0.5 - Math.random());
        const selectedChoices = [correctWord, ...shuffledOthers.slice(0, 3)].sort(() => 0.5 - Math.random());
        setOptions(selectedChoices);
        setSelectedAnswer(null);
      };

      useEffect(() => {
        if (mode === "quiz") {
          generateQuizOptions(currentIndex);
        }
      }, [currentIndex, mode, currentCategory]);

      const handleAnswer = (choice) => {
        if (selectedAnswer) return;
        setSelectedAnswer(choice);
        const correct = choice.word === words[currentIndex].word;
        if (correct) {
          setScore(score + 10);
          setStreak(streak + 1);
          speakWord(words[currentIndex].word);
        } else {
          setStreak(0);
        }
      };

      const nextQuestion = () => {
        if (currentIndex < words.length - 1) {
          setCurrentIndex(currentIndex + 1);
        } else {
          alert(`恭喜完成！總得分：${score} 分`);
          setCurrentIndex(0);
          setScore(0);
          setStreak(0);
          setMode("list");
        }
      };

      return (
        <div className="max-w-4xl mx-auto px-4 py-8">
          <header className="text-center mb-8">
            <h1 className="text-3xl md:text-4xl font-extrabold text-amber-400 mb-2 tracking-wide">
              <i className="fa-solid fa-wand-magic-sparkles mr-2"></i>
              Spelling Words 4th Grade 單字大冒險
            </h1>
            <p className="text-slate-400 text-sm md:text-base">選擇關卡類別，開始學習與測驗！</p>
          </header>

          <div className="flex flex-wrap justify-center gap-2 mb-8">
            {Object.keys(ALL_WORDS).map((cat) => (
              <button
                key={cat}
                onClick={() => {
                  setCurrentCategory(cat);
                  setCurrentIndex(0);
                  setSelectedAnswer(null);
                }}
                className={`px-4 py-2 rounded-xl text-sm font-bold transition-all shadow-md ${
                  currentCategory === cat
                    ? "bg-amber-500 text-slate-950 scale-105"
                    : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                }`}
              >
                No. {cat}
              </button>
            ))}
          </div>

          <div className="flex justify-center gap-4 mb-8">
            <button
              onClick={() => setMode("list")}
              className={`px-6 py-2.5 rounded-lg font-bold flex items-center gap-2 ${
                mode === "list" ? "bg-indigo-600 text-white" : "bg-slate-800 text-slate-400"
              }`}
            >
              <i className="fa-solid fa-book"></i> 單字列表
            </button>
            <button
              onClick={() => {
                setMode("quiz");
                setCurrentIndex(0);
                setScore(0);
                setStreak(0);
              }}
              className={`px-6 py-2.5 rounded-lg font-bold flex items-center gap-2 ${
                mode === "quiz" ? "bg-indigo-600 text-white" : "bg-slate-800 text-slate-400"
              }`}
            >
              <i className="fa-solid fa-gamepad"></i> 闖關測驗
            </button>
          </div>

          {mode === "list" && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {words.map((item) => (
                <div
                  key={item.id}
                  className="bg-slate-800 border border-slate-700/60 p-4 rounded-xl flex items-center justify-between hover:border-amber-500/50 transition-all shadow-md"
                >
                  <div className="flex items-center gap-4">
                    <span className="text-xs font-bold text-amber-400 bg-amber-400/10 px-2.5 py-1 rounded-md">
                      #{item.id}
                    </span>
                    <div>
                      <h3 className="text-lg font-bold text-white tracking-wide">{item.word}</h3>
                      <p className="text-slate-400 text-sm">{item.translation}</p>
                    </div>
                  </div>
                  <button
                    onClick={() => speakWord(item.word)}
                    className="w-10 h-10 bg-slate-700/80 hover:bg-amber-500 hover:text-slate-950 text-slate-300 rounded-full flex items-center justify-center transition-all"
                    title="發音"
                  >
                    <i className="fa-solid fa-volume-high"></i>
                  </button>
                </div>
              ))}
            </div>
          )}

          {mode === "quiz" && words.length > 0 && (
            <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 md:p-8 max-w-xl mx-auto shadow-2xl">
              <div className="flex justify-between items-center mb-6 text-sm text-slate-400 border-b border-slate-700 pb-4">
                <span>進度: {currentIndex + 1} / {words.length}</span>
                <span className="text-amber-400 font-bold">分數: {score}</span>
                <span className="text-orange-400 font-bold">連勝: 🔥 {streak}</span>
              </div>

              <div className="text-center my-6">
                <span className="text-xs font-bold text-amber-400 bg-amber-400/10 px-3 py-1 rounded-full">
                  No. #{words[currentIndex].id}
                </span>
                <h2 className="text-3xl font-extrabold text-white mt-4 mb-2 tracking-wide">
                  {words[currentIndex].word}
                </h2>
                <button
                  onClick={() => speakWord(words[currentIndex].word)}
                  className="mt-2 px-4 py-1.5 bg-indigo-600/30 text-indigo-300 hover:bg-indigo-600 hover:text-white rounded-full text-sm font-semibold transition-all inline-flex items-center gap-2"
                >
                  <i className="fa-solid fa-volume-high"></i> 播放發音
                </button>
              </div>

              <div className="grid grid-cols-1 gap-3 my-6">
                {options.map((option, idx) => {
                  let btnStyle = "bg-slate-700 text-slate-200 hover:bg-slate-600";
                  if (selectedAnswer) {
                    if (option.word === words[currentIndex].word) {
                      btnStyle = "bg-emerald-600 text-white font-bold";
                    } else if (option.word === selectedAnswer.word) {
                      btnStyle = "bg-rose-600 text-white";
                    } else {
                      btnStyle = "bg-slate-800 text-slate-500 opacity-50";
                    }
                  }

                  return (
                    <button
                      key={idx}
                      disabled={!!selectedAnswer}
                      onClick={() => handleAnswer(option)}
                      className={`p-4 rounded-xl text-left font-semibold transition-all flex items-center justify-between ${btnStyle}`}
                    >
                      <span>{option.translation}</span>
                      {selectedAnswer && option.word === words[currentIndex].word && (
                        <i className="fa-solid fa-circle-check text-white text-lg"></i>
                      )}
                    </button>
                  );
                })}
              </div>

              {selectedAnswer && (
                <div className="mt-6 text-center">
                  <button
                    onClick={nextQuestion}
                    className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl transition-all shadow-lg"
                  >
                    {currentIndex < words.length - 1 ? "下一題 ➔" : "查看結算 🏆"}
                  </button>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
